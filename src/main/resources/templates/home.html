<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Trực Tuyến - GraphQL</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        :root {
            --bg-page: #f9fafb;
            --surface: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --primary: #111827;
            --primary-hover: #1f2937;
            --accent-blue: #2563eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Navbar tối giản, sạch sẽ */
        .site-header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-logo {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.3px;
        }

        .nav-link-custom {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
            text-decoration: none;
            padding: 0.5rem 0.85rem;
            border-radius: 6px;
            transition: color 0.15s ease;
        }

        .nav-link-custom:hover, .nav-link-custom.active {
            color: var(--text-main);
            background-color: #f3f4f6;
        }

        /* Filter Pills */
        .filter-chip {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.45rem 0.9rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            user-select: none;
        }

        .filter-chip:hover {
            color: var(--text-main);
            border-color: #d1d5db;
        }

        .filter-chip.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Sort Button */
        .btn-sort {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.45rem 0.9rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        .btn-sort:hover {
            border-color: #9ca3af;
        }

        .btn-sort.active {
            background: #111827;
            color: #ffffff;
            border-color: #111827;
        }

        /* Card Sản Phẩm Tối Giản */
        .product-item {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .product-item:hover {
            border-color: #9ca3af;
            transform: translateY(-2px);
        }

        .product-thumb {
            width: 100%;
            height: 200px;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-details {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-cat {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.6rem;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-detail {
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.825rem;
            font-weight: 500;
            padding: 0.4rem 0.75rem;
            transition: background 0.15s ease;
        }

        .btn-detail:hover {
            background: #f3f4f6;
        }

        /* Offcanvas / Modal gọn gàng */
        .modal-content {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <!-- Header tối giản -->
    <header class="site-header py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-4">
                <a href="/" class="brand-logo">
                    <span>VietAPI</span> <span class="text-muted fw-normal fs-6">/ GraphQL</span>
                </a>
                <nav class="d-none d-md-flex gap-1">
                    <a href="/" class="nav-link-custom active">Trang chủ</a>
                    <a href="/admin" class="nav-link-custom">Quản trị</a>
                </nav>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="/graphiql" target="_blank" class="nav-link-custom text-dark" title="Mở GraphiQL">
                    <i class="fa-solid fa-code me-1"></i> GraphiQL
                </a>
                <a href="/swagger-ui.html" target="_blank" class="nav-link-custom text-dark" title="Mở Swagger REST">
                    <i class="fa-solid fa-book-open me-1"></i> Swagger
                </a>
                <a href="/admin" class="btn btn-dark btn-sm rounded-2 px-3 fw-medium">
                    Quản lý
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container py-4">

        <!-- Tiêu đề trang ngắn gọn, tinh tế -->
        <div class="d-flex flex-wrap justify-content-between align-items-center pb-3 mb-4 border-bottom">
            <div>
                <h4 class="fw-bold mb-1" id="currentViewTitle">Danh mục sản phẩm</h4>
                <p class="text-muted small mb-0">Truy xuất dữ liệu trực tiếp qua GraphQL API</p>
            </div>
            <div>
                <span class="text-muted small" id="productCountBadge">0 sản phẩm</span>
            </div>
        </div>

        <!-- Thanh công cụ lọc & sắp xếp tối giản -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <!-- Danh mục (Chips) -->
            <div class="d-flex flex-wrap gap-2 align-items-center" id="categoryChipsContainer">
                <div class="filter-chip active" data-cat-id="" onclick="filterByCategory('', this)">
                    Tất cả
                </div>
                <!-- Danh mục nạp động từ GraphQL -->
            </div>

            <!-- Sắp xếp & Tìm kiếm -->
            <div class="d-flex align-items-center gap-2">
                <!-- Nút sắp xếp giá tăng dần (Mục 5) -->
                <button id="btnSortPrice" class="btn btn-sort" onclick="toggleSortPrice()">
                    <i class="fa-solid fa-arrow-down-short-wide me-1"></i> Giá: Thấp &rarr; Cao
                </button>

                <!-- Ô tìm kiếm nhỏ gọn -->
                <div class="input-group input-group-sm" style="width: 220px;">
                    <input type="text" id="homeSearchInput" class="form-control rounded-start-2 border-end-0" placeholder="Tìm kiếm..." onkeyup="if(event.key==='Enter') searchHomeProducts()">
                    <button class="btn btn-outline-secondary border-start-0 bg-white" onclick="searchHomeProducts()">
                        <i class="fa-solid fa-magnifying-glass text-muted"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Lưới sản phẩm -->
        <div class="row g-3" id="productsGrid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                <span class="ms-2 text-muted small">Đang tải dữ liệu...</span>
            </div>
        </div>

    </main>

    <!-- Modal Chi Tiết Sản Phẩm (Tối giản) -->
    <div class="modal fade" id="productDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h6 class="modal-title fw-bold" id="detailProductName">Chi tiết</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-3">
                    <div class="bg-light rounded-2 mb-3 overflow-hidden text-center" style="height: 220px;">
                        <img id="detailProductImage" src="" alt="Product" class="w-100 h-100 object-fit-cover">
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-light text-secondary border" id="detailCategoryName">Category</span>
                        <span class="fs-5 fw-bold" id="detailProductPrice">0 ₫</span>
                    </div>
                    <p class="text-secondary small mb-3" id="detailDescription"></p>
                    <div class="border-top pt-2 small text-muted d-flex justify-content-between">
                        <span>Kho: <b class="text-dark" id="detailQuantity">0</b></span>
                        <span id="detailCreateDate"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/graphql-client.js"></script>

    <script>
        let currentSelectedCategoryId = "";
        let isSortedByPriceAsc = false;

        document.addEventListener('DOMContentLoaded', () => {
            loadCategoriesList();
            loadDefaultProducts();
        });

        // Nạp danh sách category cho thanh filter
        async function loadCategoriesList() {
            try {
                const categories = await getAllCategories();
                const container = document.getElementById('categoryChipsContainer');
                
                categories.forEach(cat => {
                    const chip = document.createElement('div');
                    chip.className = 'filter-chip';
                    chip.setAttribute('data-cat-id', cat.categoryId);
                    chip.onclick = () => filterByCategory(cat.categoryId, chip, cat.categoryName);
                    chip.innerText = cat.categoryName;
                    container.appendChild(chip);
                });
            } catch (err) {
                console.error("Không thể tải danh mục:", err);
            }
        }

        // Tải sản phẩm mặc định
        async function loadDefaultProducts() {
            try {
                const pageData = await getProductsPaged(0, 12, "");
                renderProducts(pageData.content);
                document.getElementById('currentViewTitle').innerText = 'Danh mục sản phẩm';
            } catch (err) {
                renderError(err.message);
            }
        }

        // Chức năng 1 (Mục 5): Hiển thị tất cả product có price từ thấp đến cao
        async function loadAllProductsSortedPrice() {
            try {
                isSortedByPriceAsc = true;
                document.getElementById('btnSortPrice').classList.add('active');
                document.querySelectorAll('.filter-chip').forEach(p => p.classList.remove('active'));
                
                document.getElementById('currentViewTitle').innerText = 'Sản phẩm theo giá: Thấp → Cao';
                showLoading();

                const products = await getProductsSortedByPriceAsc();
                renderProducts(products);
            } catch (err) {
                renderError(err.message);
            }
        }

        function toggleSortPrice() {
            if (!isSortedByPriceAsc) {
                loadAllProductsSortedPrice();
            } else {
                isSortedByPriceAsc = false;
                document.getElementById('btnSortPrice').classList.remove('active');
                if (currentSelectedCategoryId) {
                    const activeChip = document.querySelector(`.filter-chip[data-cat-id="${currentSelectedCategoryId}"]`);
                    filterByCategory(currentSelectedCategoryId, activeChip);
                } else {
                    const allChip = document.querySelector('.filter-chip[data-cat-id=""]');
                    filterByCategory('', allChip);
                }
            }
        }

        // Chức năng 2 (Mục 5): Lấy tất cả product của 01 category
        async function filterByCategory(categoryId, chipElement, categoryName = "Tất cả") {
            try {
                currentSelectedCategoryId = categoryId;
                isSortedByPriceAsc = false;
                document.getElementById('btnSortPrice').classList.remove('active');

                document.querySelectorAll('.filter-chip').forEach(p => p.classList.remove('active'));
                if (chipElement) chipElement.classList.add('active');

                showLoading();

                if (!categoryId || categoryId === '') {
                    document.getElementById('currentViewTitle').innerText = 'Danh mục sản phẩm';
                    const pageData = await getProductsPaged(0, 12, "");
                    renderProducts(pageData.content);
                } else {
                    document.getElementById('currentViewTitle').innerText = categoryName;
                    const products = await getProductsByCategory(categoryId);
                    renderProducts(products);
                }
            } catch (err) {
                renderError(err.message);
            }
        }

        async function searchHomeProducts() {
            const keyword = document.getElementById('homeSearchInput').value.trim();
            try {
                showLoading();
                document.getElementById('currentViewTitle').innerText = keyword ? `Tìm kiếm: "${keyword}"` : 'Danh mục sản phẩm';
                const pageData = await getProductsPaged(0, 12, keyword, currentSelectedCategoryId);
                renderProducts(pageData.content);
            } catch (err) {
                renderError(err.message);
            }
        }

        function showLoading() {
            document.getElementById('productsGrid').innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                    <span class="ms-2 text-muted small">Đang tải dữ liệu GraphQL...</span>
                </div>
            `;
        }

        function renderError(msg) {
            document.getElementById('productsGrid').innerHTML = `
                <div class="col-12 text-center py-5">
                    <p class="text-danger small mb-0">Lỗi kết nối GraphQL: ${msg}</p>
                </div>
            `;
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            const countBadge = document.getElementById('productCountBadge');

            if (!products || products.length === 0) {
                grid.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <p class="text-muted small">Không tìm thấy sản phẩm nào.</p>
                    </div>
                `;
                countBadge.innerText = '0 sản phẩm';
                return;
            }

            countBadge.innerText = `${products.length} sản phẩm`;
            let html = '';

            products.forEach(p => {
                let imgUrl = 'https://placehold.co/400x300?text=No+Image';
                if (p.images && p.images.trim() !== '') {
                    imgUrl = `/images/${encodeURIComponent(p.images)}`;
                }
                const catName = p.category ? p.category.categoryName : 'Khác';

                html += `
                    <div class="col-6 col-md-4 col-lg-3">
                        <div class="product-item">
                            <div class="product-thumb">
                                <img src="${imgUrl}" alt="${p.productName}" onerror="this.src='https://placehold.co/400x300?text=Product'">
                            </div>
                            <div class="product-details">
                                <div class="product-cat">${catName}</div>
                                <div class="product-title" title="${p.productName}">${p.productName}</div>
                                <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
                                    <div class="product-price">${formatCurrency(p.unitPrice)}</div>
                                    <button class="btn-detail" onclick="viewProductDetail('${p.productId}')">
                                        Chi tiết
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        async function viewProductDetail(productId) {
            try {
                const p = await getProductById(productId);
                if (!p) return;

                document.getElementById('detailProductName').innerText = p.productName;
                document.getElementById('detailProductPrice').innerText = formatCurrency(p.unitPrice);
                document.getElementById('detailCategoryName').innerText = p.category ? p.category.categoryName : 'Không có';
                document.getElementById('detailDescription').innerText = p.description || 'Chưa có mô tả chi tiết.';
                document.getElementById('detailQuantity').innerText = p.quantity;
                document.getElementById('detailCreateDate').innerText = p.createDate ? 'Ngày tạo: ' + p.createDate.substring(0, 10) : '';

                let imgUrl = 'https://placehold.co/400x300?text=No+Image';
                if (p.images && p.images.trim() !== '') {
                    imgUrl = `/images/${encodeURIComponent(p.images)}`;
                }
                document.getElementById('detailProductImage').src = imgUrl;

                const modal = new bootstrap.Modal(document.getElementById('productDetailModal'));
                modal.show();
            } catch (err) {
                Swal.fire('Thông báo', err.message, 'error');
            }
        }
    </script>
</body>
</html>
